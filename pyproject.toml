[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "policyproof"
version = "0.1.0"
description = "Find the gaps and conflicts in the business policy your AI agent follows, generate boundary tests, and grade agent decisions against it."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shalu Kumari" }]
requires-python = ">=3.9"
keywords = ["ai-agents", "llm-evaluation", "policy", "decision-table", "testing", "compliance"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
policyproof = "policyproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
